# Builds the mod on every push and pull request. Pushing a tag that starts with
# "v" (for example v1.0.0) also publishes a GitHub release with the mod jar.

name: build
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed to create the release
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the remapped mod jar only; skip the -sources and -dev jars
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n 1)
          gh release create "$GITHUB_REF_NAME" "$JAR" \
            --title "Magnesium $GITHUB_REF_NAME" \
            --generate-notes
